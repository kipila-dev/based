[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forje-tailwind"
dynamic = ["version"]
description = "Tailwind CSS color palette plugin for Forje"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kipila Ltd", email = "hello@kipila.dev" }]
dependencies = ["forje"]

[project.urls]
Homepage = "https://kipila.dev"
Repository = "https://github.com/kipila-dev/forje"

[tool.hatch.version]
path = "src/forje_tailwind/__init__.py"

[project.entry-points."forje.dsl"]
tailwind = "forje_tailwind:module"

[tool.uv.sources]
forje = { workspace = true }
