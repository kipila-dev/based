[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basedbuild-tailwind"
dynamic = ["version"]
description = "Tailwind CSS v4 color palette plugin for based"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kipila Ltd", email = "hello@kipila.dev" }]
dependencies = ["basedbuild"]

[project.urls]
Homepage = "https://kipila.dev"
Repository = "https://github.com/kipila-dev/based"

[tool.hatch.version]
path = "src/based_tailwind/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/based_tailwind"]

[project.entry-points."based.dsl"]
tailwind = "based_tailwind:module"

[tool.uv.sources]
basedbuild = { workspace = true }
