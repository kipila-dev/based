[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forje"
dynamic = ["version"]
description = "The build system for your design system"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kipila Ltd", email = "hello@kipila.dev" }]
dependencies = ["coloraide", "pydantic", "resforge", "starlark-pyo3", "typer"]

[project.urls]
Homepage = "https://kipila.dev"
Repository = "https://github.com/kipila-dev/forje"

[project.scripts]
forje = "forje.cli.main:app"

[project.entry-points."forje.dsl"]
color = "forje.dsl.color:module"
default = "forje.dsl.default:module"
dimen = "forje.dsl.dimen:module"
stdlib = "forje.dsl.stdlib:module"
wcag = "forje.wcag:module"

[project.entry-points."forje.annotations_adapter"]
against = "forje.wcag.models:against_adapter"
artifact = "forje.ir:artifact_adapter"
color = "forje.ir:color_adapter"
dimen = "forje.ir:dimen_adapter"
target = "forje.ir:target_adapter"
token = "forje.ir:token_adapter"

[project.entry-points."forje.pass"]
wcag = "forje.wcag:WCAGValidation"

[project.entry-points."forje.backend"]
android = "forje.backend.android:Android"
apple = "forje.backend.apple:Apple"
compose = "forje.backend.compose:Compose"
css = "forje.backend.css:CSS"

[tool.hatch.version]
path = "src/forje/__init__.py"

[tool.uv.sources]
resforge = { workspace = true }
