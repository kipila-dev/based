[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forje-lsp"
dynamic = ["version"]
description = "Forje Language Server Protocol"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kipila Ltd", email = "hello@kipila.dev" }]
dependencies = ["forje", "pygls"]

[project.urls]
Homepage = "https://kipila.dev"
Repository = "https://github.com/kipila-dev/forje"

[project.scripts]
forje-lsp = "forje_lsp.server:main"

[tool.hatch.version]
path = "src/forje_lsp/__init__.py"

[tool.uv.sources]
forje = { workspace = true }
