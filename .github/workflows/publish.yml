name: Publish to PyPI
on:
  push:
    tags:
      - 'resforge-v*'
      - 'forje-v*'
      - 'forje-tailwind-v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Extract package name from tag
        id: pkg
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build --package ${{ steps.pkg.outputs.name }} --out-dir dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
