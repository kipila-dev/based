name: Publish to PyPI
on:
  push:
    tags:
      - "?*-v[0-9]+\\.[0-9]+\\.[0-9]+"
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Extract package name from tag
        id: pkg
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - name: Replace symlinked README with real file
        if: steps.pkg.outputs.name == 'basedbuild'
        run: |
          PKG_DIR="packages/${{ steps.pkg.outputs.name }}"
          rm -f "$PKG_DIR/README.md"
          cp README.md "$PKG_DIR/README.md"
      - name: Build package
        run: uv build --package ${{ steps.pkg.outputs.name }} --out-dir dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
