name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv-and-sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv-and-sync
      - run: uv run ty check
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [resforge]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv-and-sync
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest packages/${{ matrix.package }}/tests/ -v
